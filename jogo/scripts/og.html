<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Anton; src: url(/fontes/anton-latin.woff2) format('woff2'); }
  @font-face { font-family: Inter; src: url(/fontes/inter-latin.woff2) format('woff2'); font-weight: 100 900; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #3d241d; }
  .fila { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; padding: 4px; height: 128px; }
  .fila canvas { width: 100%; height: 100%; display: block; border-radius: 3px; }
  .relvado {
    position: relative; height: 374px; overflow: hidden; display: grid; place-content: center; text-align: center;
    background: repeating-linear-gradient(90deg, #1c6b40 0 100px, #175c36 100px 200px);
    border-block: 6px solid #e7efe9;
  }
  .relvado::before { content: ''; position: absolute; top: 0; bottom: 0; left: calc(50% - 3px); width: 6px; background: #e7efe9aa; }
  .relvado::after { content: ''; position: absolute; left: 50%; top: 50%; width: 300px; height: 300px; transform: translate(-50%, -50%); border: 6px solid #e7efe9aa; border-radius: 50%; }
  .sombra { position: absolute; inset: 0; background: radial-gradient(ellipse at center, #06140dcc 25%, #06140d33 75%); z-index: 1; }
  h1 { position: relative; z-index: 2; font: 400 150px/1 Anton, Impact, sans-serif; letter-spacing: .02em; color: #fff; text-shadow: 0 8px 30px #000a; }
  h1 span { color: #e6b98a; }
  p { position: relative; z-index: 2; margin-top: 18px; font: 700 32px Inter, sans-serif; color: #f2ece2; text-shadow: 0 2px 12px #000c; }
</style>
</head>
<body>
  <div class="fila" id="cima"></div>
  <div class="relvado"><div class="sombra"></div><div><h1>COACH <span>BOARD</span></h1><p>Cria o clube. Domina o mercado. Ganha a liga.</p></div></div>
  <div class="fila" id="baixo"></div>
<script type="module">
  import { pintarCasa } from '/js/casas.js';
  await Promise.all([document.fonts.load('800 40px Inter'), document.fonts.load('400 150px Anton')]);
  const fila = (id, tipos) => {
    for (const tipo of tipos) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 320;
      pintarCasa(canvas.getContext('2d'), tipo, canvas.width, canvas.height);
      document.getElementById(id).append(canvas);
    }
  };
  fila('cima', ['sad', 'patrocinio', 'mercado', 'jovens', 'rede', 'misterio']);
  fila('baixo', ['investigacao', 'empresario', 'mercado', 'medico', 'jovens', 'inicio']);
</script>
</body>
</html>
